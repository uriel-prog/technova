            <a href="tecnologias.html">Tecnologias</a>

    <section class="contato">
    
        <h2>Entre em Contato</h2>
    
        <p>Solicite um orçamento ou tire suas dúvidas</p>
      
    <form>

        <input type="text" placeholder="Nome Completo" required>
            
        <input type="email" placeholder="E-mail" required>

        <input type="tel" placeholder="Telefone">
        <select required>
            <option value="">Selecione um serviço</option>
            <option value="">Desenvolvimento Web</option>
            <option value="">Inteligência Artificial</option>
            <option value="">Cloud Computing</option>
        </select>

        <textarea rows="6" placeholder="Descreva sua necessidade..." required></textarea>
        
        <button type="submit">Enviar Solicitação</button>
    </form>
    </section> 
</body>
</html>
